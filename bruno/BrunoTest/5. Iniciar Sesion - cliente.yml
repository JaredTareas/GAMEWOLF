info:
  name: 05. Iniciar sesion - cliente
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/autenticacion/iniciar-sesion"
  body:
    type: json
    data: |-
      {
        "email": "cliente@gamewolf.test",
        "password": "GameWolf#2026"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.status === 200) {
          bru.setVar("token_cliente", res.body.token);
        }
    - type: tests
      code: |-
        test("El login del cliente responde 200", function() {
          expect(res.status).to.equal(200);
          expect(res.body.token).to.be.a('string');
          expect(res.body.usuario.rol).to.equal('cliente');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
