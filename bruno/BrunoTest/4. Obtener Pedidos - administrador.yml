info:
  name: 04. Obtener pedidos - administrador
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/pedidos?per_page=2"
  auth:
    type: bearer
    token: "{{token_admin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("El administrador puede consultar pedidos paginados", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.be.an('array');
          expect(res.body.meta).to.be.an('object');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
