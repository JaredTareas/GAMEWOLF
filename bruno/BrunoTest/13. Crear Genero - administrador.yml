info:
  name: 13. Crear genero - administrador
  type: http
  seq: 13

http:
  method: POST
  url: "{{base_url}}/generos"
  body:
    type: json
    data: |-
      {
        "nombre": "Genero Bruno de prueba"
      }
  auth:
    type: bearer
    token: "{{token_admin}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.status === 201) {
          bru.setVar("genero_creado_id", res.body.data.id);
        }
    - type: tests
      code: |-
        test("El administrador puede crear generos", function() {
          expect(res.status).to.equal(201);
          expect(res.body.data.nombre).to.equal("Genero Bruno de prueba");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
