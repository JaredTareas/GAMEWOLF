info:
  name: 03. Error de validacion - videojuego (422)
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/videojuegos"
  body:
    type: json
    data: |-
      {
        "titulo": "",
        "precio": "letras"
      }
  auth:
    type: bearer
    token: "{{token_admin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Los datos incompletos devuelven 422", function() {
          expect(res.status).to.equal(422);
          expect(res.body.errors).to.be.an('object');
          expect(res.body.errors.titulo).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
