info:
  name: 10. Videojuegos con filtro y paginacion
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}/videojuegos?search=Elden&per_page=2"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El catálogo responde paginado y acepta filtros en la API", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.be.an('array');
          expect(res.body.meta).to.be.an('object');
          expect(res.body.meta.per_page).to.equal(2);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
