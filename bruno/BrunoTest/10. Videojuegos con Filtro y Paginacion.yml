info:
  name: 10. Videojuegos con filtro y paginacion
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}/videojuegos?per_page=2&estado=activo"
  params:
    - name: per_page
      value: "2"
      type: query
    - name: estado
      value: activo
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.status === 200 && res.body.data && res.body.data.length > 0) {
          bru.setVar("videojuego_id", res.body.data[0].id);
        }
    - type: tests
      code: |-
        test("El catálogo responde paginado y filtra por estado en la API", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.be.an('array');
          expect(res.body.meta).to.be.an('object');
          expect(res.body.meta.per_page).to.equal(2);
          res.body.data.forEach(function(videojuego) {
            expect(videojuego.estado).to.equal('activo');
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
