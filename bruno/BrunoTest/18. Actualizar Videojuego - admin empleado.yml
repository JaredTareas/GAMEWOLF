info:
  name: 18. Actualizar videojuego - admin o empleado
  type: http
  seq: 18

http:
  method: PUT
  url: "{{base_url}}/videojuegos/{{videojuego_creado_id}}"
  body:
    type: json
    data: |-
      {
        "titulo": "{{videojuego_titulo_actualizado}}",
        "descripcion": "Videojuego actualizado desde Bruno.",
        "plataforma": "PC",
        "precio": 600,
        "stock": 8,
        "imagen": "https://wallpapercave.com/wp/wp15596619.jpg",
        "estado": "activo",
        "genero_ids": ["{{genero_id}}"]
      }
  auth:
    type: bearer
    token: "{{token_admin}}"

runtime:
  scripts:
    - type: pre-request
      code: |-
        bru.setVar("videojuego_titulo_actualizado", "Videojuego Bruno Editado " + Date.now());
    - type: tests
      code: |-
        test("Admin o empleado puede actualizar videojuegos", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.titulo).to.equal(bru.getVar("videojuego_titulo_actualizado"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
