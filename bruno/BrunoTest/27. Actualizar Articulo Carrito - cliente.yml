info:
  name: 27. Actualizar articulo del carrito - cliente
  type: http
  seq: 27

http:
  method: PUT
  url: "{{base_url}}/carrito/articulos/{{articulo_carrito_id}}"
  body:
    type: json
    data: |-
      {
        "videojuego_id": "{{articulo_videojuego_id}}",
        "cantidad": 2
      }
  auth:
    type: bearer
    token: "{{token_cliente}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("El cliente puede cambiar cantidades del carrito", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.detalles).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
