info:
  name: 02. Perfil protegido - administrador
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/autenticacion/perfil"
  auth:
    type: bearer
    token: "{{token_admin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("El token permite consultar un endpoint protegido", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.email).to.equal('admin@gamewolf.test');
          expect(res.body.data.rol).to.equal('admin');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
