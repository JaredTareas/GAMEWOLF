info:
  name: 14. Actualizar genero - administrador
  type: http
  seq: 14

http:
  method: PUT
  url: "{{base_url}}/generos/{{genero_creado_id}}"
  body:
    type: json
    data: |-
      {
        "nombre": "Genero Bruno actualizado"
      }
  auth:
    type: bearer
    token: "{{token_admin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("El administrador puede actualizar generos", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.nombre).to.equal("Genero Bruno actualizado");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
