info:
  name: 30. Cambiar estado pedido - admin o empleado
  type: http
  seq: 30

http:
  method: PATCH
  url: "{{base_url}}/pedidos/{{pedido_id}}/estado"
  body:
    type: json
    data: |-
      {
        "estado": "pagado"
      }
  auth:
    type: bearer
    token: "{{token_admin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Admin o empleado puede cambiar el estado del pedido", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.estado).to.equal('pagado');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
