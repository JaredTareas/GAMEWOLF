info:
  name: 21. Listar usuarios - admin o empleado
  type: http
  seq: 21

http:
  method: GET
  url: "{{base_url}}/usuarios?per_page=5"
  auth:
    type: bearer
    token: "{{token_admin}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.status === 200 && res.body.data && res.body.data.length > 0) {
          bru.setVar("usuario_id", res.body.data[0].id);
        }
    - type: tests
      code: |-
        test("Admin o empleado puede consultar usuarios", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
