info:
  name: 11. Listar generos
  type: http
  seq: 11

http:
  method: GET
  url: "{{base_url}}/generos?per_page=1"
  params:
    - name: per_page
      value: "1"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.status === 200 && res.body.data && res.body.data.length > 0) {
          bru.setVar("genero_id", res.body.data[0].id);
        }
    - type: tests
      code: |-
        test("La API publica lista generos", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
